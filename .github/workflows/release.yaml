name: release

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package README into chart
        run: cp README.md charts/immich/README.md

      - name: Inject changelog into chart annotations
        env:
          NOTES: ${{ github.event.release.body }}
        run: |
          descs=$(printf '%s\n' "$NOTES" \
            | mdq --output plain '-' \
            | sed -E 's/ \([0-9a-f]{7,40}\)//g; /^[[:space:]]*$/d' \
            | awk '!seen[$0]++' || true)
          if [ -n "$descs" ]; then
            export descs
            changes=$(yq -n -o=yaml 'strenv(descs) | split("\n") | map(select(. != "")) | .[] style="double"')
            export changes
            yq -i '.annotations."artifacthub.io/changes" = strenv(changes)' charts/immich/Chart.yaml
          else
            echo "No changelog entries parsed from release notes; leaving annotations unchanged."
          fi

      - name: build chart dependencies
        run: helm dependency build charts/immich

      - name: package chart
        run: helm package charts/immich --destination .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Chart
        id: push
        run: |
          output=$(helm push immich-*.tgz oci://ghcr.io/${{ github.repository }} 2>&1)
          echo "$output"
          digest=$(echo "$output" | awk '/^Digest:/ { print $2 }')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign Chart
        run: cosign sign -y "ghcr.io/${{ github.repository }}/immich@${{ steps.push.outputs.digest }}"

      - name: Push ArtifactHub metadata
        run: |
          created=$(git log -1 --format=%cI -- charts/immich/artifacthub-repo.yml)
          oras push \
            ghcr.io/${{ github.repository }}/immich:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            --annotation org.opencontainers.image.created="$created" \
            charts/immich/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
